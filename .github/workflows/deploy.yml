# deploy.yml -- CI on every push/PR to main; Cloud Run deploy only when you switch it on.
# To enable deploy: GitHub repo -> Settings -> Secrets and variables -> Actions
#   Secrets:   GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID (keyless Workload Identity Federation; no JSON key)
#   Variables: DEPLOY_ENABLED = true
name: GeoSense CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The existing tests in tests/ call a RUNNING server and local data, so CI does not run them.
      # Until you add data-free unit tests, CI proves the code compiles and the frontend image builds.
      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests
      # The backend image bakes in LiDAR/U-Net/label data from data/ (not in git), so it is
      # built locally / with Cloud Build, not in CI.
      - name: Build frontend image (no push)
        run: docker build -f deploy/Dockerfile.frontend -t geosense-frontend:ci .

  deploy:
    needs: checks
    if: ${{ github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push frontend image
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geosense-repo/geosense-frontend:${{ github.sha }}
          docker build -f deploy/Dockerfile.frontend -t "$IMAGE" .
          docker push "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: geosense-frontend
          region: asia-southeast1
          image: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geosense-repo/geosense-frontend:${{ github.sha }}
